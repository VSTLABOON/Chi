<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Soft shadow -->
  <ellipse cx="50" cy="90" rx="26" ry="4" fill="rgba(0,0,0,0.15)" />
  
  <!-- Back tail fin -->
  <path d="M 72 50 L 92 32 C 95 35, 95 65, 92 68 Z" fill="#FF8C00" stroke="#E06C00" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M 72 50 L 88 40 C 90 42, 90 58, 88 60 Z" fill="#FFA500" />

  <!-- Main Body (Cute chubby orange fish) -->
  <ellipse cx="48" cy="50" rx="28" ry="22" fill="#FFA500" stroke="#E06C00" stroke-width="2" />

  <!-- Top fin -->
  <path d="M 40 29 C 48 16, 60 20, 64 29" fill="none" stroke="#FF8C00" stroke-width="5" stroke-linecap="round" />
  
  <!-- Bottom fin -->
  <path d="M 45 71 C 50 80, 56 78, 58 71" fill="none" stroke="#FF8C00" stroke-width="4" stroke-linecap="round" />

  <!-- Cute side fin (swimming) -->
  <path d="M 42 55 Q 32 64 36 68 Q 44 64 44 55" fill="#FF8C00" stroke="#E06C00" stroke-width="1" />

  <!-- Big sweet eye -->
  <circle cx="28" cy="44" r="6" fill="#2E1C0C" />
  <circle cx="26" cy="42" r="2" fill="#FFFFFF" />
  <circle cx="30" cy="46" r="0.8" fill="#FFFFFF" />

  <!-- Smiling mouth -->
  <path d="M 18 52 Q 22 56 26 51" fill="none" stroke="#2E1C0C" stroke-width="2" stroke-linecap="round" />

  <!-- Blush Cheek -->
  <ellipse cx="33" cy="50" rx="4.5" ry="3" fill="#FFA3A3" opacity="0.75" />

  <!-- Tiny bubbles -->
  <circle cx="15" cy="30" r="2.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1" />
  <circle cx="10" cy="22" r="1.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8" />
</svg>
