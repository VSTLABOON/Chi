<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Soft shadow -->
  <ellipse cx="50" cy="88" rx="35" ry="4" fill="rgba(0,0,0,0.15)" />
  
  <!-- Legs -->
  <rect x="25" y="70" width="6" height="18" rx="3" fill="#8B5E3C" />
  <rect x="33" y="70" width="6" height="18" rx="3" fill="#2E2E2E" />
  <rect x="62" y="70" width="6" height="18" rx="3" fill="#8B5E3C" />
  <rect x="70" y="70" width="6" height="18" rx="3" fill="#2E2E2E" />
  
  <!-- Long Body -->
  <rect x="22" y="44" width="52" height="30" rx="15" fill="#2E2E2E" stroke="#1F1F1F" stroke-width="1.5" />
  
  <!-- Tan Chest Spot -->
  <path d="M 22 59 C 22 74, 38 74, 38 59" fill="#8B5E3C" />

  <!-- Tail -->
  <path d="M 72 52 Q 86 42 84 34 Q 78 34 72 48" fill="#2E2E2E" stroke="#1F1F1F" stroke-width="1.5" stroke-linecap="round" />

  <!-- Neck -->
  <path d="M 24 50 L 32 30 L 40 38 L 32 56 Z" fill="#2E2E2E" />
  
  <!-- Face -->
  <ellipse cx="38" cy="28" rx="14" ry="10" fill="#2E2E2E" stroke="#1F1F1F" stroke-width="1.5" />
  <path d="M 38 28 Q 48 28 50 32 Q 44 38 38 32 Z" fill="#8B5E3C" /> <!-- Tan snout -->
  <circle cx="50" cy="32" r="2.5" fill="#1A1A1A" /> <!-- Nose -->

  <!-- Floppy Ear -->
  <path d="M 28 24 C 24 24, 22 42, 28 44 C 32 45, 34 30, 32 24 Z" fill="#1F1F1F" />

  <!-- Eye -->
  <circle cx="40" cy="24" r="3.5" fill="#1A1A1A" />
  <circle cx="39" cy="22.5" r="1" fill="#FFFFFF" />
  
  <!-- Tan Eyebrow Dots -->
  <circle cx="37" cy="18" r="2" fill="#8B5E3C" />
  <circle cx="43" cy="19" r="2" fill="#8B5E3C" />
  
  <!-- Blush Cheek -->
  <ellipse cx="44" cy="30" rx="3.5" ry="2.5" fill="#FFA3A3" opacity="0.6" />
</svg>
