<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Soft shadow -->
  <ellipse cx="50" cy="90" rx="28" ry="4" fill="rgba(0,0,0,0.15)" />
  
  <!-- Flippers (back) -->
  <path d="M 35 68 Q 20 78 28 85 Q 38 78 38 68" fill="#4D8BBE" />
  <path d="M 68 68 Q 80 78 72 85 Q 64 78 64 68" fill="#4D8BBE" />

  <!-- Main Body -->
  <path d="M 22 55 C 22 35, 78 35, 78 55 C 78 75, 22 75, 22 55 Z" fill="#66A3D2" stroke="#4D8BBE" stroke-width="2" />
  
  <!-- Head profile -->
  <path d="M 24 55 Q 12 50 16 42 Q 26 40 28 50" fill="#66A3D2" />
  
  <!-- Tail -->
  <path d="M 76 56 Q 96 52 94 66 Q 90 70 76 58" fill="#66A3D2" stroke="#4D8BBE" stroke-width="1.5" />
  <path d="M 94 66 Q 98 76 92 78 Q 88 74 94 66" fill="#4D8BBE" /> <!-- tail fin -->

  <!-- Flippers (front) -->
  <path d="M 38 62 Q 22 76 26 84 Q 40 76 38 62" fill="#66A3D2" stroke="#4D8BBE" stroke-width="1.5" />
  <path d="M 62 62 Q 78 76 74 84 Q 60 76 62 62" fill="#66A3D2" stroke="#4D8BBE" stroke-width="1.5" />

  <!-- Eye -->
  <circle cx="28" cy="46" r="4.5" fill="#2E1C0C" />
  <circle cx="26.5" cy="44.5" r="1.5" fill="#FFFFFF" />

  <!-- Smiling mouth -->
  <path d="M 20 52 Q 24 56 26 52" fill="none" stroke="#2E1C0C" stroke-width="2" stroke-linecap="round" />

  <!-- Blush Cheek -->
  <ellipse cx="32" cy="50" rx="4" ry="2.5" fill="#FFA3A3" opacity="0.75" />
</svg>
